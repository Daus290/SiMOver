<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #f1f5f9;">
  <defs>
    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="parkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="650" fill="#f8fafc" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <!-- Green areas (Parks, Hutan Kota, Perbukitan) -->
  <path d="M 680,180 Q 750,150 820,210 T 900,320 T 780,380 T 670,290 Z" fill="url(#parkGrad)" opacity="0.6"/>
  <path d="M 120,380 Q 200,350 260,420 T 220,530 T 130,490 Z" fill="url(#parkGrad)" opacity="0.5"/>
  <path d="M 420,80 Q 520,60 580,130 T 480,200 Z" fill="url(#parkGrad)" opacity="0.5"/>
  <text x="730" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#15803d" font-weight="600" opacity="0.7">Hutan Kota Mentaos</text>
  <text x="140" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#15803d" font-weight="600" opacity="0.7">Kawasan Lindung Trikora</text>

  <!-- Waterway / Sungai Kemuning -->
  <path d="M 380,0 Q 420,120 450,220 T 520,380 T 500,520 T 530,650" fill="none" stroke="url(#waterGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 380,0 Q 420,120 450,220 T 520,380 T 500,520 T 530,650" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="490" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0369a1" font-style="italic" transform="rotate(75, 490, 340)">Sungai Kemuning</text>

  <!-- Secondary Roads (Gray lines) -->
  <!-- Jl. Panglima Batur -->
  <path d="M 180,210 L 720,210" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
  <path d="M 180,210 L 720,210" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" font-weight="500">Jl. Panglima Batur</text>

  <!-- Jl. Pangeran Suriansyah -->
  <path d="M 460,210 L 460,380" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 460,210 L 460,380" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="470" y="250" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" font-weight="500">Jl. P. Suriansyah (Dishub)</text>

  <!-- Jl. Guntung Manggis & Payung Link -->
  <path d="M 280,150 L 280,500" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
  <path d="M 280,150 L 280,500" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Jl. Karang Anyar -->
  <path d="M 150,150 L 480,150" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
  <path d="M 150,150 L 480,150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Primary Arterial: Jl. Ahmad Yani (Main corridor) -->
  <path d="M 0,280 C 180,280 260,290 400,290 C 520,290 620,280 730,280 L 1000,280" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 0,280 C 180,280 260,290 400,290 C 520,290 620,280 730,280 L 1000,280" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round"/>
  <path d="M 0,280 C 180,280 260,290 400,290 C 520,290 620,280 730,280 L 1000,280" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,6"/>
  
  <text x="80" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b45309" font-weight="700">Jl. Jenderal Ahmad Yani (Arah Banjarmasin)</text>
  <text x="760" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b45309" font-weight="700">Jl. Jenderal Ahmad Yani (Arah Martapura)</text>

  <!-- Primary Arterial: Jl. Trikora (Southern Bypass) -->
  <path d="M 0,480 C 180,480 320,490 520,490 C 700,490 800,480 1000,470" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  <path d="M 0,480 C 180,480 320,490 520,490 C 700,490 800,480 1000,470" fill="none" stroke="#dbeafe" stroke-width="8" stroke-linecap="round"/>
  <path d="M 0,480 C 180,480 320,490 520,490 C 700,490 800,480 1000,470" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="320" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" font-weight="700">Jl. Trikora (Jalur Angkutan Barang &amp; Logistik)</text>

  <!-- Arterial: Jl. Mistar Cokrokusumo (Connecting southward to Cempaka & Pelaihari) -->
  <path d="M 720,280 L 750,420 L 780,650" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round"/>
  <path d="M 720,280 L 750,420 L 780,650" fill="none" stroke="#dbeafe" stroke-width="8" stroke-linecap="round"/>
  <path d="M 720,280 L 750,420 L 780,650" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="765" y="550" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1d4ed8" font-weight="700" transform="rotate(75, 765, 550)">Jl. Mistar Cokrokusumo (Arah Cempaka)</text>

  <!-- Bundaran Banjarbaru (Simpang Empat) Circle -->
  <circle cx="720" cy="280" r="32" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="720" cy="280" r="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="720" cy="280" r="10" fill="#f59e0b"/>
  <text x="720" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">Bundaran Simpang 4</text>

  <!-- Landmarks -->
  <!-- Balai Kota / Lapangan Murjani -->
  <rect x="520" y="210" width="80" height="40" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="560" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#854d0e" font-weight="600" text-anchor="middle">Lapangan Murjani</text>

  <!-- Kantor Dishub Banjarbaru -->
  <g transform="translate(425, 220)">
    <rect width="28" height="20" rx="3" fill="#1e3a8a"/>
    <text x="14" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#ffffff" font-weight="700" text-anchor="middle">DISHUB</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="230" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a" font-weight="700">Keterangan Peta Wilayah</text>
    
    <!-- Legend items -->
    <line x1="15" y1="42" x2="45" y2="42" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <text x="55" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Jalan Arteri Primer (A. Yani)</text>
    
    <line x1="15" y1="62" x2="45" y2="62" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <text x="55" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Jalur Angkutan Barang (Trikora)</text>
    
    <circle cx="28" cy="84" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="55" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Titik CCTV Aktif (Online)</text>

    <circle cx="28" cy="106" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="55" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Titik CCTV Non-Aktif (Offline)</text>

    <text x="15" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" font-style="italic">Kota Banjarbaru, Kalimantan Selatan</text>
  </g>
</svg>
