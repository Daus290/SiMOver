<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Emblem Shield -->
  <g transform="translate(6, 6)">
    <!-- Base Shield -->
    <path d="M24 2 C36 2 44 8 44 20 C44 34 24 46 24 46 C24 46 4 34 4 20 C4 8 12 2 24 2 Z" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Inner Wings / Wheel -->
    <circle cx="24" cy="21" r="10" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Wing left -->
    <path d="M14 21 Q7 16 9 10 Q16 14 18 18 Z" fill="url(#goldGrad)"/>
    <!-- Wing right -->
    <path d="M34 21 Q41 16 39 10 Q32 14 30 18 Z" fill="url(#goldGrad)"/>
    <!-- Anchor / Wheel Hub -->
    <circle cx="24" cy="21" r="4" fill="#fbbf24"/>
    <path d="M24 15 L24 27 M18 21 L30 21" stroke="#0a2540" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M21 34 Q24 38 27 34" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Brand Text -->
  <text x="62" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">DISHUB</text>
  <text x="62" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="1">KOTA BANJARBARU</text>
  <text x="62" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">Sistem Monitoring Over Dimension</text>
</svg>
