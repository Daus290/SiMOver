<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <!-- Truk Kontainer / Petikemas -->
  <rect width="320" height="200" rx="12" fill="#f8fafc"/>
  <g transform="translate(10, 15)">
    <!-- Cabin Tractor Head -->
    <path d="M 15,65 L 55,65 L 55,125 L 15,125 Z" fill="#ef4444"/>
    <path d="M 15,65 L 30,30 L 55,30 L 55,65 Z" fill="#f87171"/>
    <path d="M 19,60 L 32,35 L 50,35 L 50,60 Z" fill="#fee2e2"/>
    <!-- Exhaust Stack -->
    <rect x="53" y="15" width="4" height="25" fill="#94a3b8"/>
    <!-- Fifth wheel coupling gap -->
    <rect x="55" y="105" width="20" height="15" fill="#334155"/>
    <!-- Container Box (Corrugated pattern) -->
    <rect x="75" y="25" width="215" height="95" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- Corrugation lines -->
    <line x1="95" y1="25" x2="95" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="115" y1="25" x2="115" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="135" y1="25" x2="135" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="155" y1="25" x2="155" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="175" y1="25" x2="175" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="195" y1="25" x2="195" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="215" y1="25" x2="215" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="235" y1="25" x2="235" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="255" y1="25" x2="255" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="275" y1="25" x2="275" y2="120" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Container text -->
    <text x="85" y="45" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff" opacity="0.8">DSHB-40FT</text>
    <!-- Trailer Chassis -->
    <rect x="70" y="120" width="225" height="10" fill="#1e293b"/>
    <!-- Wheels -->
    <circle cx="35" cy="130" r="16" fill="#0f172a"/>
    <circle cx="35" cy="130" r="7" fill="#94a3b8"/>
    <circle cx="215" cy="130" r="16" fill="#0f172a"/>
    <circle cx="215" cy="130" r="7" fill="#94a3b8"/>
    <circle cx="250" cy="130" r="16" fill="#0f172a"/>
    <circle cx="250" cy="130" r="7" fill="#94a3b8"/>
  </g>
</svg>
