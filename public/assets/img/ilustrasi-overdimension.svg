<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" width="100%" height="100%" role="img" aria-label="Ilustrasi Skematik Perbandingan Dimensi Standar dan Over Dimension">
  <title>Perbandingan Dimensi Standar dan Over Dimension</title>
  <desc>Ilustrasi skematik tampak samping memperlihatkan batas dimensi yang diizinkan dibandingkan bagian kendaraan yang melebihi batas panjang dan tinggi.</desc>

  <defs>
    <!-- Gradien Badan Truk Standar (Biru) -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gradien Muatan Over Dimension (Oranye) -->
    <linearGradient id="overDimBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Pola Arsiran Pelanggaran -->
    <pattern id="diagHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f97316" stroke-width="2.5" />
    </pattern>
  </defs>

  <!-- Header Judul & Subjudul Ilustrasi -->
  <text x="35" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Perbandingan Dimensi Standar dan Over Dimension</text>
  <text x="35" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Ilustrasi tampak samping: analisis panjang dan tinggi fisik kendaraan</text>

  <!-- 1. Garis Permukaan Jalan (Baseline Kontak Ban) -->
  <line x1="35" y1="355" x2="765" y2="355" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  <!-- 2. Struktur Sasis Kendaraan (Batang Baja Penghubung Roda & Bak) -->
  <rect x="75" y="316" width="595" height="12" rx="2" fill="#1e293b" />
  <!-- Bumper Belakang / Pengaman Bawah -->
  <rect x="658" y="322" width="12" height="22" rx="2" fill="#334155" />
  <!-- Tangki Bahan Bakar / Kotak Peralatan di Bawah Sasis -->
  <rect x="205" y="306" width="115" height="26" rx="3" fill="#475569" stroke="#334155" stroke-width="1.5" />
  <!-- Pelindung Samping (Side Guard Rail) -->
  <rect x="335" y="318" width="130" height="12" rx="2" fill="#64748b" />

  <!-- 3. Badan Truk Bagian Depan (Kabin & Kemudi) -->
  <!-- Bumper Depan -->
  <rect x="68" y="312" width="22" height="26" rx="3" fill="#334155" />
  <!-- Bodi Bawah Kabin -->
  <path d="M 80,248 L 175,248 L 175,324 L 80,324 Z" fill="#475569" />
  <!-- Spakbor Roda Depan (Fender Arc) -->
  <path d="M 100,324 A 35,35 0 0,1 170,324" fill="none" stroke="#334155" stroke-width="4" />
  <!-- Bagian Atas Kabin & Kaca Depan Aerodinamis -->
  <path d="M 80,248 L 115,185 L 175,185 L 175,248 Z" fill="#64748b" />
  <!-- Kaca Depan & Jendela Samping -->
  <path d="M 94,242 L 122,192 L 165,192 L 165,242 Z" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5" />
  <!-- Spion Samping -->
  <rect x="84" y="208" width="5" height="16" rx="1.5" fill="#1e293b" />
  <line x1="89" y1="216" x2="98" y2="216" stroke="#1e293b" stroke-width="2" />
  <!-- Lampu Depan Utama -->
  <rect x="74" y="286" width="6" height="14" rx="2" fill="#facc15" stroke="#eab308" stroke-width="1" />
  <!-- Gagang Pintu -->
  <rect x="146" y="264" width="12" height="3" rx="1.5" fill="#1e293b" />

  <!-- 4. Bak Muatan Standar Pabrik (Dimensi Sesuai Ketentuan) -->
  <rect x="180" y="205" width="350" height="111" rx="3" fill="url(#truckBody)" />
  <text x="355" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Dimensi Standar Pabrik</text>

  <!-- 5. Area Muatan Melebihi Dimensi (Over Dimension: Menjulang ke Atas & Memanjang ke Belakang) -->
  <!-- Blok Muatan Tambahan Belakang & Atas -->
  <path d="M 330,120 L 670,120 L 670,316 L 530,316 L 530,205 L 330,205 Z" fill="url(#overDimBody)" />
  <path d="M 330,120 L 670,120 L 670,316 L 530,316 L 530,205 L 330,205 Z" fill="url(#diagHatch)" opacity="0.25" />
  <!-- Garis Batas Merah Pelanggaran Dimensi -->
  <path d="M 330,120 L 670,120 L 670,316 L 530,316 L 530,205 L 330,205 Z" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7,4" rx="3" />
  <!-- Teks Keterangan Pelanggaran pada Muatan -->
  <text x="600" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Muatan Lebih /</text>
  <text x="600" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Panjang Tambahan</text>

  <!-- 6. Kotak Batas Acuan Legal (Garis Hijau Putus-putus) -->
  <rect x="180" y="160" width="350" height="156" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" rx="4" />
  <!-- Label Batas Acuan Hijau -->
  <rect x="185" y="165" width="165" height="24" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1" />
  <text x="267" y="181" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Batas Dimensi yang Diizinkan</text>

  <!-- 7. Badge Label Pelanggaran Over Dimensi (Merah Atas) -->
  <rect x="495" y="80" width="180" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="585" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">PELANGGARAN OVER DIMENSI</text>

  <!-- 8. Roda Kendaraan (Konfigurasi 3 Sumbu Realistis: 1 Depan + 2 Belakang Tandem) -->
  <!-- Roda Depan (cy = 329, r = 26 -> Bagian Bawah Ban Menyentuh Garis Jalan y = 355) -->
  <g id="wheelFront">
    <circle cx="135" cy="329" r="26" fill="#1e293b" />
    <circle cx="135" cy="329" r="15" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <circle cx="135" cy="329" r="6" fill="#334155" />
    <!-- Baut Roda -->
    <circle cx="135" cy="320" r="1.5" fill="#f8fafc" />
    <circle cx="135" cy="338" r="1.5" fill="#f8fafc" />
    <circle cx="126" cy="329" r="1.5" fill="#f8fafc" />
    <circle cx="144" cy="329" r="1.5" fill="#f8fafc" />
  </g>

  <!-- Spakbor Tandem Belakang -->
  <path d="M 462,324 A 35,35 0 0,1 596,324" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Roda Belakang 1 (Tandem Depan) -->
  <g id="wheelRear1">
    <circle cx="495" cy="329" r="26" fill="#1e293b" />
    <circle cx="495" cy="329" r="15" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <circle cx="495" cy="329" r="6" fill="#334155" />
    <!-- Baut Roda -->
    <circle cx="495" cy="320" r="1.5" fill="#f8fafc" />
    <circle cx="495" cy="338" r="1.5" fill="#f8fafc" />
    <circle cx="486" cy="329" r="1.5" fill="#f8fafc" />
    <circle cx="504" cy="329" r="1.5" fill="#f8fafc" />
  </g>

  <!-- Roda Belakang 2 (Tandem Belakang) -->
  <g id="wheelRear2">
    <circle cx="560" cy="329" r="26" fill="#1e293b" />
    <circle cx="560" cy="329" r="15" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <circle cx="560" cy="329" r="6" fill="#334155" />
    <!-- Baut Roda -->
    <circle cx="560" cy="320" r="1.5" fill="#f8fafc" />
    <circle cx="560" cy="338" r="1.5" fill="#f8fafc" />
    <circle cx="551" cy="329" r="1.5" fill="#f8fafc" />
    <circle cx="569" cy="329" r="1.5" fill="#f8fafc" />
  </g>

  <!-- 9. Panah Indikator Dimensi (Panjang & Tinggi) -->
  <!-- Panah Panjang Keseluruhan Kendaraan -->
  <g id="lengthArrow">
    <line x1="68" y1="392" x2="670" y2="392" stroke="#ea580c" stroke-width="2" />
    <polygon points="68,388 56,392 68,396" fill="#ea580c" />
    <polygon points="670,388 682,392 670,396" fill="#ea580c" />
    <!-- Garis Batas Ujung Proyeksi -->
    <line x1="68" y1="340" x2="68" y2="402" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="670" y1="320" x2="670" y2="402" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <!-- Label Panjang -->
    <rect x="290" y="380" width="160" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1" />
    <text x="370" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Panjang Melebihi Batas</text>
  </g>

  <!-- Panah Tinggi Keseluruhan Kendaraan -->
  <g id="heightArrow">
    <line x1="710" y1="120" x2="710" y2="355" stroke="#ea580c" stroke-width="2" />
    <polygon points="706,120 710,108 714,120" fill="#ea580c" />
    <polygon points="706,355 710,367 714,355" fill="#ea580c" />
    <!-- Garis Batas Proyeksi Tinggi -->
    <line x1="670" y1="120" x2="725" y2="120" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="670" y1="355" x2="725" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
    <!-- Label Tinggi -->
    <rect x="722" y="226" width="54" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1" />
    <text x="749" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Tinggi</text>
  </g>
</svg>
